name: Package

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Validate Package on ${{ matrix.entry.os }}${{ matrix.entry.npm && format(' with npm {0}', matrix.entry.npm) || '' }}
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
          - { os: ubuntu-latest, npm: 12.2.3 }
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7.0.1
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select npm Version
        if: matrix.entry.npm
        run: npm install --global "npm@${{ matrix.entry.npm }}"
      - name: Install Dependencies
        run: npm ci
      - name: Validate Packed Consumer
        run: npm run package:check
